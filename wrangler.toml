name = "catalogo"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Vitrine (/) e painel (/admin) são arquivos estáticos; /api e /img passam pelo Worker
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/img/*"]

[[d1_databases]]
binding = "DB"
database_name = "catalogo-db"
database_id = "COLE_AQUI_O_ID_DO_D1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGENS"
bucket_name = "catalogo-imagens"

# Segredos (não ficam neste arquivo):
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put SESSION_SECRET   (opcional, texto aleatório longo)
