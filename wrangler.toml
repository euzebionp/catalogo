name = "catalogo"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Vitrine (/) e painel (/admin) são arquivos estáticos; /api e /img passam pelo Worker
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/img/*"]

[[d1_databases]]
binding = "DB"
database_name = "catalogo-db"
database_id = "d86d0a84-5548-468f-a2ee-0d3858c076f6"
migrations_dir = "migrations"

# Fotos no KV (gratuito, sem cartão). Para usar R2, troque por:
# [[r2_buckets]]
# binding = "IMAGENS"
# bucket_name = "catalogo-imagens"
[[kv_namespaces]]
binding = "IMAGENS_KV"
id = "635962451a234bd3b09abab68b2b338b"

[observability]
enabled = true

# Segredos (cadastrados no painel da Cloudflare, nunca neste arquivo):
#   ADMIN_PASSWORD  -> senha do painel /admin
#   SESSION_SECRET  -> texto aleatório longo
